# Publishes a Vault Launcher release from an "upload-*" branch.
# The build machine pushes a single orphan commit with the installer, its blockmap and latest.yml
# to a branch named upload-<version>. This workflow turns it into a GitHub Release (which is
# where the launcher's auto-updater looks) and then deletes the branch, so the big installer
# never becomes part of main's history.
name: Publish release
on:
  push:
    branches: ['upload-*']
permissions:
  contents: write
jobs:
  # Microsoft Store package (.msix). Built from the same files as the installer; the Store signs it
  # after certification, so it's uploaded unsigned to Partner Center. Attached to the release as
  # VaultLauncher-Store-<version>.msix.
  store:
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Build MSIX
        shell: pwsh
        run: |
          $v = (Select-String -Path latest.yml -Pattern '^version:\s*(\S+)').Matches[0].Groups[1].Value
          $parts = $v.Split('.') + @('0','0','0')
          $ver = "$($parts[0]).$($parts[1]).$($parts[2]).0"
          7z x -y "VaultLauncher-Setup-$v.exe" -onsis | Out-Null
          New-Item -ItemType Directory -Force pkg | Out-Null
          7z x -y 'nsis/$PLUGINSDIR/app-64.7z' -opkg | Out-Null
          Copy-Item -Recurse store/assets pkg/assets
          $id = Get-Content store/identity.json -Raw | ConvertFrom-Json
          (Get-Content store/AppxManifest.template.xml -Raw).Replace('{{NAME}}', $id.name).Replace('{{PUBLISHER}}', $id.publisher).Replace('{{PUBLISHER_DISPLAY}}', $id.publisherDisplayName).Replace('{{VERSION}}', $ver) | Set-Content -Encoding utf8 pkg/AppxManifest.xml
          $mk = Get-ChildItem 'C:/Program Files (x86)/Windows Kits/10/bin/*/x64/makeappx.exe' | Sort-Object FullName -Descending | Select-Object -First 1
          & $mk.FullName pack /d pkg /p "VaultLauncher-Store-$v.msix" /o
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        with:
          name: msix
          path: '*.msix'
  publish:
    needs: store
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: msix
      - name: Read version
        id: v
        run: echo "version=$(grep '^version:' latest.yml | awk '{print $2}')" >> "$GITHUB_OUTPUT"
      - name: Build portable zip (no installer)
        run: |
          sudo apt-get install -y p7zip-full >/dev/null
          V=${{ steps.v.outputs.version }}
          7z x -y "VaultLauncher-Setup-$V.exe" -onsis >/dev/null
          mkdir -p "portable/Vault Launcher"
          7z x -y 'nsis/$PLUGINSDIR/app-64.7z' -o"portable/Vault Launcher" >/dev/null
          printf 'This copy of Vault Launcher runs without installing.\r\nTo update, download the new zip from https://steamvault.dev/vaultlauncher and replace this folder.\r\n' > "portable/Vault Launcher/portable.txt"
          (cd portable && zip -qr9 "../VaultLauncher-Portable-$V.zip" "Vault Launcher")
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.v.outputs.version }}
          name: Vault Launcher ${{ steps.v.outputs.version }}
          body_path: NOTES.md
          make_latest: true
          files: |
            *.exe
            *.blockmap
            *.zip
            *.msix
            latest.yml
      - name: Remove upload branch
        run: git push origin --delete "${GITHUB_REF_NAME}"
