# Sends each new release to the Microsoft Store as an update submission (Microsoft still reviews it).
# Needs one repository secret, PARTNER_CENTER_CLIENT_SECRET (the key of the "Vault Store Upload" app in
# Partner Center). Until it's added this does nothing. The IDs below aren't secret.
# If a submission is still being reviewed, this one is skipped and the next release catches up.
name: Submit to Microsoft Store
on:
  workflow_run:
    workflows: ['Publish release']
    types: [completed]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  submit:
    if: ${{ github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}
      PC_TENANT: 09603462-ddfc-4d66-a405-28bac7fd06e1
      PC_SELLER: '96795550'
      PC_CLIENT: 5ba4fb1c-03af-4432-9ffa-868ff4c22472
      PC_SECRET: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET }}
      HAS_KEYS: ${{ secrets.PARTNER_CENTER_CLIENT_SECRET != '' }}
    steps:
      - name: Skip (no Partner Center keys yet)
        if: env.HAS_KEYS != 'true'
        run: echo "Add the Partner Center secrets to submit automatically."
      - uses: actions/checkout@v4
        if: env.HAS_KEYS == 'true'
      - name: Get the newest Store package
        if: env.HAS_KEYS == 'true'
        shell: pwsh
        run: |
          gh release download --repo $env:GITHUB_REPOSITORY -p "VaultLauncher-Store-*.msix" -D pkg
          Get-ChildItem pkg
      - uses: microsoft/microsoft-store-apppublisher@v1.1
        if: env.HAS_KEYS == 'true'
      - name: Sign in to Partner Center
        if: env.HAS_KEYS == 'true'
        shell: pwsh
        run: msstore reconfigure --tenantId $env:PC_TENANT --sellerId $env:PC_SELLER --clientId $env:PC_CLIENT --clientSecret $env:PC_SECRET
      - name: Submit the update
        if: env.HAS_KEYS == 'true'
        shell: pwsh
        run: |
          msstore publish "$env:GITHUB_WORKSPACE\pkg" --inputDirectory "$env:GITHUB_WORKSPACE\pkg" --appId 9NT96QS862FF --verbose
